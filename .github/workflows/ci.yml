name: CI & GitOps Strategy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: npm ci
    - run: npm test

  build-and-push:
    needs: test
    # Só publica imagem e atualiza manifestos em push na main (PRs rodam apenas os testes)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Segurança: limita permissões padrão

    steps:
    # 1. Baixa o código da API
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Login no Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Define a tag baseada no SHA curto do commit
    - name: Set Short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 4. Build e Push da Imagem Docker
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          BUILD_SHA=${{ steps.vars.outputs.sha_short }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/task-api:${{ steps.vars.outputs.sha_short }}

    # 5. Atualiza o Repositório de Manifestos (GitOps)
    - name: Update Manifest Repository
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        MANIFEST_REPO: pdro1812/task-api-manifests 
        IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/task-api
        NEW_TAG: ${{ steps.vars.outputs.sha_short }}
      run: |
        echo "🚀 Iniciando atualização de manifesto para: $NEW_TAG"
        
        # Clona o repo
        git clone https://$GH_PAT@github.com/$MANIFEST_REPO.git deployment-repo
        cd deployment-repo
        
        # Configura git user
        git config user.name "GitHub Actions CI"
        git config user.email "actions@github.com"
        
        # Debug: Mostra como estava antes (bom para evidência no artigo)
        echo "📄 Versão anterior:"
        grep "image:" 3-api.yaml
        
        # Atualiza a tag (Regex ajustado para pegar espaços em branco antes de 'image:')
        sed -i "s|image: .*$IMAGE_NAME:.*|image: $IMAGE_NAME:$NEW_TAG|g" 3-api.yaml
        
        # Verifica mudança
        if [[ -n $(git status -s) ]]; then
          echo "📄 Nova versão:"
          grep "image:" 3-api.yaml
          
          git add 3-api.yaml
          git commit -m "k8s(ci): update image tag to $NEW_TAG"
          git push origin main
          echo "✅ Manifesto atualizado e push realizado!"
        else
          echo "⚠️ Nenhuma alteração necessária."
        fi